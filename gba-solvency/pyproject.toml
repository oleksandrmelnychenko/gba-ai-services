[project]
name = "gba-solvency"
version = "0.1.0"
description = "GBA Client Solvency (CreditScore-100) Service"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.162,<0.170",
    "uvicorn[standard]>=0.54,<0.60",
    "pydantic>=2.14,<3",
    "pydantic-settings>=2.16,<3",
    "sqlalchemy>=2.1,<2.2",
    "pymssql>=2.4,<2.5",
    "redis>=8.1,<9",
    "structlog>=26.1,<27",
    "numpy>=2.5,<2.6",
    "pandas>=3.1,<3.2",
    "pyarrow>=26,<27",
    "scikit-learn==1.9.0",
    "joblib>=1.6,<2",
    "python-dateutil>=2.9,<3",
]

[project.optional-dependencies]
dev = [
    "pytest>=9.2,<10",
    "ruff>=0.17,<0.18",
    "httpx2>=2.16,<3",
    "pytest-asyncio>=1.5,<2",
    "httpx>=0.28,<1",
    "matplotlib>=3.11,<4",
]

[tool.setuptools.packages.find]
include = ["app*"]

[tool.ruff]
line-length = 110
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
markers = [
    "integration: DB-backed smoke against the dev DB; skipped without DB env, run via 'make integration'",
]
