[project]
name = "gba-reco"
version = "0.1.0"
description = "GBA Client Product Recommendation Service"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.162,<0.170",
    "uvicorn[standard]>=0.54,<0.60",
    "pydantic>=2.14,<3",
    "pydantic-settings>=2.16,<3",
    "sqlalchemy>=2.1,<2.2",
    "pymssql>=2.4,<2.5",
    "redis>=8.1,<9",
    "structlog>=26.1,<27",
    "numpy>=2.4.6,<2.5",
]

[project.optional-dependencies]
dev = [
    "pytest>=9.2,<10",
    "ruff>=0.17,<0.18",
    "httpx2>=2.16,<3",
    "pytest-asyncio>=1.5,<2",
]

[tool.ruff]
line-length = 110
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
markers = [
    "integration: DB-backed smoke against the live dev DB; skipped without DB env (run via 'make integration')",
]
